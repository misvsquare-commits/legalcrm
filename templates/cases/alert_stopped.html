<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alerts Stopped — LegalCRM</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
  body { font-family:'DM Sans',sans-serif; background:#f5f4f0; min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { border:none; border-radius:16px; box-shadow:0 4px 24px rgba(0,0,0,.08); max-width:460px; width:100%; }
</style>
</head>
<body>
<div class="card p-5 text-center">
  <i class="bi bi-check-circle-fill text-success" style="font-size:52px;display:block;margin-bottom:16px"></i>
  <h4 style="font-family:'Playfair Display',serif;color:#0f1b35">Done — Reminders Stopped</h4>
  <p class="text-muted mt-2" style="font-size:14px">
    7-day reminders for <strong>{{ opt_out.case.title }}</strong> have been stopped.<br>
    You will still receive a final reminder <strong>the day before</strong> the hearing on <strong>{{ opt_out.hearing_date|date:"d M Y" }}</strong>.
  </p>
  <div class="mt-3 p-3 rounded" style="background:#f0fdf4;border:1px solid #bbf7d0;font-size:13px;color:#166534">
    <i class="bi bi-calendar-event me-1"></i> Hearing: {{ opt_out.case.court_name }} — {{ opt_out.hearing_date|date:"d M Y" }}
  </div>
</div>
</body>
</html>
